# CI: every push and every pull request. A red job blocks the merge (branch protection on main).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Python: allocation package and API ----------
  python-quality:
    name: Python · format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -e "packages/allocation[dev]" -r services/api/requirements-dev.txt
      - run: ruff format --check packages services/api
      - run: ruff check packages services/api
      - run: mypy packages/allocation/src --ignore-missing-imports

  python-tests:
    name: Python · unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt
      - run: pip install -e "packages/allocation[dev]" -r services/api/requirements-dev.txt
      - name: Allocation unit tests (coverage gate 80%)
        run: pytest packages/allocation --cov=allocation --cov-fail-under=80
      - name: API integration tests (walkthrough on SQLite)
        working-directory: services/api
        env:
          DATABASE_URL: "sqlite://"
          JWT_SECRET: ci-only-secret
        run: pytest -q

  python-security:
    name: Security · Python dependencies and code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e "packages/allocation[dev]" -r services/api/requirements-dev.txt
      - name: Known vulnerabilities in pinned API dependencies (fails on any finding)
        run: pip-audit -r services/api/requirements.txt
      - name: Static security analysis (medium and high findings fail)
        run: bandit -r packages/allocation/src services/api/app -ll

  # ---------- Web: Next.js app ----------
  web-quality:
    name: Web · format, lint, types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx prettier --check "app/**/*.{ts,tsx,css}" "components/**/*.{ts,tsx}" "lib/**/*.{ts,tsx}"
      - run: npm run lint
      - run: npx tsc --noEmit

  web-tests:
    name: Web · unit tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  web-security:
    name: Security · web dependencies
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Critical vulnerabilities in shipped dependencies (fails)
        run: npm audit --omit=dev --audit-level=critical
      - name: All vulnerabilities, including dev tools (report only)
        run: npm audit --audit-level=high || echo "::warning::High-severity findings listed above are tracked in docs/security.md"
        continue-on-error: true

  # ---------- Whole repository ----------
  secrets:
    name: Security · committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 detect --source=/repo --redact --exit-code 1

  docker:
    name: Docker · build images and scan them
    runs-on: ubuntu-latest
    needs: [python-tests, web-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: docker compose config -q
      - name: Build API image
        run: docker build -f services/api/Dockerfile -t waypoint-api:ci .
      - name: Build web image
        run: docker build -t waypoint-web:ci --build-arg API_INTERNAL_URL=http://api:8000 apps/web
      - name: Scan API image (critical findings with a fix fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: waypoint-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan web image (critical findings with a fix fail)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: waypoint-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  stack-smoke:
    name: Stack · full system starts and each role signs in
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - name: Start the full stack (database, API with migrations and seed, web)
        run: docker compose up -d --build
      - name: Wait for the API and the web app
        run: |
          for i in $(seq 1 60); do
            curl -sf http://localhost:8000/health && curl -sf http://localhost:3000/api/health && break
            sleep 5
          done
      - name: Each seeded role signs in through the web proxy
        run: |
          for email in dispatcher loader driver store; do
            code=$(curl -s -o /tmp/login.json -w "%{http_code}" -X POST http://localhost:3000/api/auth/login \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"${email}@waypoint.demo\",\"password\":\"waypoint2026\"}")
            test "$code" = "200" || { echo "$email sign-in failed: $code"; cat /tmp/login.json; exit 1; }
            python3 -c "import json,sys; u=json.load(open('/tmp/login.json'))['user']; print(u['email'], u['role'])"
          done
      - name: Stop the stack
        if: always()
        run: docker compose down -v
